<!DOCTYPE html>
<html>
<head>
    <title>To My Jampandu Bava ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #8fd3f4, #fbc2eb);
            overflow: hidden;
        }

        /* Floating hearts */
        .heart {
            position: absolute;
            font-size: 25px;
            animation: float 5s infinite;
        }

        .heart:nth-child(1) {
            left: 10%;
            top: 20%;
        }

        .heart:nth-child(2) {
            right: 12%;
            top: 30%;
        }

        .heart:nth-child(3) {
            left: 20%;
            bottom: 15%;
        }

        .heart:nth-child(4) {
            right: 20%;
            bottom: 20%;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
                opacity: 0.5;
            }

            50% {
                transform: translateY(-30px);
                opacity: 1;
            }

            100% {
                transform: translateY(0);
                opacity: 0.5;
            }
        }

        .card {
            width: 90%;
            max-width: 420px;
            padding: 45px 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .small {
            font-size: 18px;
            color: #777;
            margin-bottom: 15px;
        }

        h1 {
            color: #e91e63;
            font-size: 34px;
            margin: 10px 0;
        }

        .emoji {
            font-size: 55px;
            margin: 15px;
        }

        .message {
            font-size: 17px;
            color: #555;
            margin-bottom: 30px;
        }

        button {
            border: none;
            padding: 14px 32px;
            border-radius: 30px;
            background: #e91e63;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="heart">💗</div>
    <div class="heart">💙</div>
    <div class="heart">💕</div>
    <div class="heart">💗</div>

    <div class="card">

        <div class="small">A little surprise for you...</div>

        <div class="emoji">🎁</div>

        <h1>To My Jampandu Bava ❤️</h1>

        <p class="message">
            I made something special just for you... ✨
        </p>

        <button onclick="nextPage()">
            Continue 💌
        </button>

    </div>

    <script>
        function nextPage() {
            window.location.href="message.html"        }
    </script>

</body>
</html>
