<!DOCTYPE html>
<html>
<head>
    <title>Our Little Memories ❤️</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #a1c4fd, #fbc2eb);
        }

        .card {
            width: 90%;
            max-width: 450px;
            padding: 25px 20px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        h1 {
            color: #ff4f81;
        }

        .photo-frame {
            width: 280px;
            height: 360px;
            margin: 20px auto;
            padding: 8px;
            background: white;
            border: 6px solid #ff7eb3;
            border-radius: 25px;
            overflow: hidden;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 15px;
        }

        .caption {
            margin: 20px 5px;
            padding: 15px;
            background: #fff0f6;
            border-radius: 15px;
            color: #ff4f81;
            font-size: 18px;
            font-weight: bold;
            min-height: 30px;
        }

        button {
            padding: 14px 25px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(45deg, #ff6f91, #ff9a9e);
            color: white;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Our Little Memories ❤️</h1>

    <div class="photo-frame">
        <img id="memoryPhoto" src="sp1.jpeg">
    </div>

    <div class="caption" id="caption">
        Ee smile chusthe chaalu... naa mood set ❤️🥰
    </div>

    <button onclick="nextPage()">
        One More Thing... 💕
    </button>

</div>

<script>

    let photos = [
        "sp1.jpeg",
        "sp2.jpeg",
        "sp3.jpeg",
        "sp4.jpeg"
    ];

    let captions = [
        "Ee smile chusthe chaalu... naa mood set ❤️🥰",
        "Ee look lo edo magic undi Bava... 😏❤️",
        "Aa cute burri buggalu chusthe... tease cheyyali anipisthundi 😂💕",
        "Ee photo matram naa favourite... nuvvu too cute ❤️🫶"
    ];

    let i = 0;

    setInterval(function() {

        i = i + 1;

        if (i == 4) {
            i = 0;
        }

        document.getElementById("memoryPhoto").src = photos[i];

        document.getElementById("caption").innerHTML = captions[i];

    }, 3000);


    function nextPage() {
        window.location.href = "secret.html";
    }

</script>

</body>
</html>
