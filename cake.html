<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday Bava ❤️</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #a1c4fd,
                #fbc2eb
            );

            overflow: hidden;
        }

        .card {
            width: 90%;
            max-width: 450px;
            padding: 30px 20px;
            background: white;
            border-radius: 30px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.2);

            position: relative;
            z-index: 2;
        }

        h1 {
            color: #ff4f81;
            font-size: 30px;
        }

        .cake {
            font-size: 100px;
            margin: 20px 0;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        .wish {
            display: none;
            margin-top: 20px;
            padding: 20px;

            background: #fff0f6;
            border-radius: 20px;

            color: #ff4f81;
            font-size: 18px;
            line-height: 1.7;
        }

        button {
            padding: 14px 25px;
            border: none;
            border-radius: 25px;

            background: linear-gradient(
                45deg,
                #ff6f91,
                #ff9a9e
            );

            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .confetti {
            position: absolute;
            top: -20px;
            font-size: 25px;

            animation: fall 4s linear infinite;
        }

        @keyframes fall {
            0% {
                top: -30px;
                transform: rotate(0deg);
            }

            100% {
                top: 110vh;
                transform: rotate(360deg);
            }
        }

        .c1 { left: 10%; animation-delay: 0s; }
        .c2 { left: 25%; animation-delay: 1s; }
        .c3 { left: 45%; animation-delay: 2s; }
        .c4 { left: 65%; animation-delay: 0.5s; }
        .c5 { left: 85%; animation-delay: 1.5s; }

    </style>
</head>

<body>

    <!-- Confetti -->
    <div class="confetti c1">🎉</div>
    <div class="confetti c2">🎊</div>
    <div class="confetti c3">❤️</div>
    <div class="confetti c4">✨</div>
    <div class="confetti c5">🎉</div>


    <div class="card">

        <h1>Happy Birthday Bava! 🎂❤️</h1>

        <div class="cake">
            🎂
        </div>

        <p>
            Birthday boy... 😏❤️
            <br>
            Make a wish! ✨
        </p>

        <button onclick="makeWish()">
            Make a Wish 🕯️✨
        </button>


        <div class="wish" id="wishMessage">

            <b>Happy Birthday to my Jampandu Bava! ❤️🎂</b>

            <br><br>

            Nuvvu always happy ga,
            smile chesthu undali. 🥰

            <br><br>

            Niku ni life antha manchi jaragali.✨❤️
            <br><br>

            And finally...

            <br>

            <b>
                Niii burri buggalu eelage cute ga
                undali😂❤️
            </b>

            <br><br>

        </div>

    </div>


    <script>

        function makeWish() {

            document.getElementById("wishMessage").style.display = "block";

        }

    </script>

</body>
</html>
